name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - id: hash
        run: echo "key=engine-${{ hashFiles('packages/engine-wasm/**', '!packages/engine-wasm/vendor/**') }}-$(git -C packages/engine-wasm/vendor/zxing-cpp rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@v4
        with:
          path: packages/engine-wasm/out
          key: ${{ steps.hash.outputs.key }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "6.0.2"
          actions-cache-folder: emsdk-cache
      - if: steps.cache.outputs.cache-hit != 'true'
        run: bash packages/engine-wasm/build.sh all
      - uses: actions/upload-artifact@v4
        with:
          name: engine-wasm
          path: packages/engine-wasm/out

  check:
    needs: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # samples de zxing-cpp para los tests de integración
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14"
      - uses: actions/download-artifact@v4
        with:
          name: engine-wasm
          path: packages/engine-wasm/out
      - run: pip install pillow && python3 -I packages/engine-wasm/test/prepare-samples.py packages/engine-wasm/vendor/zxing-cpp/test/samples packages/engine-wasm/build/samples
      - run: bun install --frozen-lockfile
      - run: node packages/scanner/scripts/copy-wasm.mjs
      - run: bun run lint
      - run: bun run typecheck
      - run: cd packages/scanner && bun scripts/api-report.ts --check
      - run: bun run test
      - run: bunx playwright install --with-deps chromium firefox webkit
      - run: bun run --filter @qhago/scanner test:browser

  parity:
    # Paridad WASM ↔ ZXing nativo sobre todos los samples × 4 rotaciones × 3 estrategias (gate G2).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: "6.0.2"
          actions-cache-folder: emsdk-cache
      - run: pip install pillow && bash packages/engine-wasm/test/parity.sh

  license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx license-checker --production --excludePrivatePackages --failOn 'GPL;AGPL;LGPL;SSPL;BUSL'
