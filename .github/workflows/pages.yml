# F7.5: sitio de docs (VitePress + TypeDoc) en GitHub Pages, servido bajo /docs/ (ScanError.docsUrl → /docs/errors#…).
# Con el dominio propio (qhago.dev) configurado en Pages, la URL queda https://qhago.dev/docs/. Sin dominio propio,
# lanza el workflow a mano con base "/<repo>/docs/".
name: Docs

on:
  push:
    branches: [master]
    paths: ["docs-site/**", "docs/guias/**", "docs/soporte.md", "bench/results/**", "packages/scanner/src/**"]
  workflow_dispatch:
    inputs:
      base:
        description: "Base del sitio"
        type: string
        default: "/docs/"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: pages

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: cd docs-site && bun run build
        env:
          DOCS_BASE: ${{ inputs.base || '/docs/' }}
      - run: mkdir -p _site/docs && cp -r docs-site/.vitepress/dist/* _site/docs/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}docs/
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
