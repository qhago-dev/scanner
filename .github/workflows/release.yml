# Publicación con trusted publishing (OIDC): sin tokens. Requiere que cada paquete
# exista en npm y tenga configurado este workflow como trusted publisher (bootstrap.yml).
name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Solo simular (no publica)"
        type: boolean
        default: true

concurrency: release

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@^11.21.0   # 11.21+: dist-tag con OIDC
      - uses: oven-sh/setup-bun@v2
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: "6.0.2"
      - run: bun install --frozen-lockfile
      - run: bash packages/engine-wasm/build.sh all
      - run: bun run build
      - run: bun run test
      - run: node scripts/check-peer.mjs   # F12: peer de @qhago/ai y plan de changesets
      - if: github.event_name == 'workflow_dispatch' && inputs.dry-run
        run: |
          bunx changeset status --verbose
          for p in packages/scanner packages/ai; do [ -f "$p/package.json" ] && (cd "$p" && npm publish --dry-run --provenance --access public) || true; done
      - if: github.event_name == 'push' || !inputs.dry-run
        id: changesets
        uses: changesets/action@v1
        with:
          # En modo pre, changeset publish usa el pre-tag (alpha/beta/rc) como dist-tag.
          publish: bunx changeset publish
          version: bunx changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
      # Mientras no haya 1.0, `latest` sigue a la última beta (changesets solo pone `beta`): así `npm i @qhago/x`
      # y la página de npm muestran la versión real. Requiere "Allow npm dist-tag" en el Trusted Publisher.
      - if: steps.changesets.outputs.published == 'true'
        env:
          PUBLISHED: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          node -e 'for (const p of JSON.parse(process.env.PUBLISHED)) console.log(p.name, p.version)' |
          while read -r name v; do
            cur=$(npm view "$name" dist-tags.latest 2>/dev/null || echo 0.0.0)
            case "$cur" in 0.*) ;; *) continue ;; esac
            npm dist-tag add "$name@$v" latest ||
              echo "::warning::No se pudo mover latest de $name (activa 'Allow npm dist-tag' en el Trusted Publisher)"
          done
      # F11: versiones publicadas de cada paquete (pueden diferir: changesets no los agrupa con fixed/linked).
      - if: steps.changesets.outputs.published == 'true'
        id: versions
        env:
          PUBLISHED: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          node -e 'const p=JSON.parse(process.env.PUBLISHED);const v=(n)=>p.find(x=>x.name===n)?.version??"";console.log(`scanner=${v("@qhago/scanner")}\nai=${v("@qhago/ai")}`)' >> "$GITHUB_OUTPUT"
      # F7.4: artefactos del motor y checksums en la GitHub Release que crea changesets (createGithubReleases).
      - if: steps.changesets.outputs.published == 'true'
        id: assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          v=$(node -e 'const p=JSON.parse(process.env.PUBLISHED).find(x=>x.name==="@qhago/scanner");console.log(p?p.version:"")')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          [ -z "$v" ] && exit 0
          cd packages/scanner/wasm && sha256sum qhago_engine.wasm qhago_engine_node.wasm > SHA256SUMS
          gh release upload "@qhago/scanner@$v" qhago_engine.wasm qhago_engine_node.wasm SHA256SUMS --clobber
    outputs:
      version: ${{ steps.assets.outputs.version }}
      scanner: ${{ steps.versions.outputs.scanner }}
      ai: ${{ steps.versions.outputs.ai }}

  smoke:
    # F7.4: instalación desde el registro con npm, pnpm, yarn y bun + CDN, sobre la versión recién publicada.
    needs: release
    if: needs.release.outputs.version != ''
    uses: ./.github/workflows/smoke.yml
    with:
      spec: "@qhago/scanner@${{ needs.release.outputs.version }}"

  showcase:
    # F11: la demo pública (showcase/) contra lo recién publicado; el paquete que no se publicó va a @latest.
    needs: release
    if: needs.release.outputs.scanner != '' || needs.release.outputs.ai != ''
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/showcase.yml
    with:
      scanner: ${{ needs.release.outputs.scanner }}
      ai: ${{ needs.release.outputs.ai }}
