<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ScanAI — ZXing WASM Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; overflow: hidden; }
    #app { position: relative; width: 100vw; height: 100dvh; display: flex; flex-direction: column; }
    #viewfinder { position: relative; flex: 1; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #000; }
    #video { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
    #canvas { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    #reticle { position: absolute; z-index: 3; width: 80%; max-width: 480px; height: 20%; max-height: 120px; border: 2px solid #22c55e55; border-radius: 8px; box-shadow: 0 0 0 9999px rgba(0,0,0,0.50); }
    #reticle .corner { position: absolute; width: 28px; height: 28px; border-color: #22c55e; border-style: solid; }
    #reticle .tl { top: -2px; left: -2px; border-width: 3px 0 0 3px; border-radius: 6px 0 0 0; }
    #reticle .tr { top: -2px; right: -2px; border-width: 3px 3px 0 0; border-radius: 0 6px 0 0; }
    #reticle .bl { bottom: -2px; left: -2px; border-width: 0 0 3px 3px; border-radius: 0 0 0 6px; }
    #reticle .br { bottom: -2px; right: -2px; border-width: 0 3px 3px 0; border-radius: 0 0 6px 0; }

    #status { text-align: center; padding: 12px; font-size: 14px; color: #94a3b8; min-height: 42px; }
    #result { padding: 16px 20px; background: #1e293b; border-top: 1px solid #334155; min-height: 90px; transition: background 0.2s; }
    #result.found { background: #14532d; border-color: #22c55e; }
    #result .label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #64748b; margin-bottom: 4px; }
    #result .text { font-size: 20px; font-weight: 700; word-break: break-all; color: #f8fafc; }
    #result .meta { font-size: 12px; color: #94a3b8; margin-top: 4px; }

    #toolbar { display: flex; gap: 10px; padding: 10px 20px; background: #1e293b; border-top: 1px solid #334155; }
    #toolbar button { flex: 1; padding: 10px; border: 1px solid #334155; border-radius: 8px; background: #334155; color: #e2e8f0; font-size: 13px; cursor: pointer; }
    #toolbar button.active { background: #22c55e; border-color: #22c55e; color: #000; font-weight: 600; }
    #toolbar select { padding: 8px 12px; border: 1px solid #334155; border-radius: 8px; background: #334155; color: #e2e8f0; font-size: 13px; }

    @keyframes scanline { 0% { top: 0; } 100% { top: 100%; } }
    #scanline { position: absolute; left: 10%; width: 80%; height: 2px; background: linear-gradient(90deg, transparent, #22c55e, transparent); z-index: 2; animation: scanline 1.5s ease-in-out infinite alternate; }
  </style>
</head>
<body>
<div id="app">
  <div id="viewfinder">
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
    <div id="reticle">
      <div class="corner tl"></div><div class="corner tr"></div>
      <div class="corner bl"></div><div class="corner br"></div>
      <div id="scanline"></div>
    </div>
  </div>
  <div id="status">Initializing ZXing-C++ WASM...</div>
  <div style="text-align:center;padding:4px;font-size:11px;color:#64748b">
    Test images: <a href="test-barcode.png" target="_blank" style="color:#22c55e">EAN-13</a> ·
    <a href="test-code128.png" target="_blank" style="color:#22c55e">Code128</a>
    <span style="margin-left:8px">(open on another screen and scan)</span>
  </div>
  <canvas id="preview" style="display:block; width:100%; max-width:480px; height:60px; margin:0 auto; border:1px solid #334155; image-rendering:pixelated;"></canvas>
  <div id="result">
    <div class="label">Last scan</div>
    <div class="text">—</div>
    <div class="meta"></div>
  </div>
  <div id="toolbar">
    <button id="btn-toggle" class="active">Scanning</button>
    <button id="btn-test">Test ZXing</button>
    <button id="btn-capture">Capture</button>
    <select id="sym-select">
      <option value="">Auto-detect</option>
      <option value="Code128">Code-128</option>
      <option value="Code39">Code-39</option>
      <option value="EAN-13">EAN-13</option>
      <option value="EAN-8">EAN-8</option>
      <option value="UPC-A">UPC-A</option>
      <option value="UPC-E">UPC-E</option>
      <option value="ITF">ITF</option>
      <option value="QRCode">QR Code</option>
      <option value="DataMatrix">Data Matrix</option>
      <option value="PDF417">PDF417</option>
      <option value="Aztec">Aztec</option>
      <option value="Codabar">Codabar</option>
    </select>
    <button id="btn-copy" disabled>Copy</button>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script type="module" src="./scanner.js"></script>
</body>
</html>
