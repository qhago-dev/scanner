<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Demo de @qhago/scanner: lee códigos de barras y QR con la cámara o desde una foto, en el navegador." />
    <meta name="theme-color" content="#0f172a" />
    <title>Qhago Scanner — demo</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body data-state="idle">
    <header class="top">
      <h1>Qhago Scanner</h1>
      <p class="tagline">Códigos de barras y QR en el navegador. Nada sale de tu dispositivo.</p>
    </header>

    <main>
      <section class="viewer" aria-label="Cámara">
        <video id="video" playsinline muted></video>
        <canvas id="overlay" aria-hidden="true"></canvas>
        <p id="status" class="status" role="status">Pulsa «Iniciar cámara» para escanear.</p>
      </section>

      <section class="controls" aria-label="Controles">
        <div class="row">
          <button id="start" type="button" class="primary">Iniciar cámara</button>
          <button id="stop" type="button" hidden>Detener</button>
        </div>
        <div class="row" id="camera-row" hidden>
          <label>Cámara
            <select id="camera"></select>
          </label>
          <button id="torch" type="button" aria-pressed="false" hidden>Linterna</button>
        </div>
        <div class="row" id="zoom-row" hidden>
          <label class="grow">Zoom
            <input id="zoom" type="range" min="1" max="1" step="0.1" value="1" />
          </label>
        </div>
        <div class="row">
          <label>Formatos
            <select id="formats">
              <option value="products">Productos (EAN/UPC)</option>
              <option value="default" selected>Por defecto</option>
              <option value="all">Todos</option>
            </select>
          </label>
          <label class="switch">
            <input id="ai" type="checkbox" />
            <span>IA</span>
          </label>
        </div>
        <p id="ai-status" class="hint" hidden></p>
        <div class="row">
          <label class="file-button">Elegir foto
            <input id="file" type="file" accept="image/*" />
          </label>
          <label class="file-button">Hacer foto
            <input id="photo" type="file" accept="image/*" capture="environment" />
          </label>
          <button id="sample" type="button">Imagen de ejemplo</button>
        </div>
      </section>

      <section id="error" class="error" role="alert" hidden>
        <strong id="error-code"></strong>
        <p id="error-message"></p>
        <p id="error-help"></p>
        <a id="error-link" href="https://qhago.dev/docs/errors" target="_blank" rel="noopener noreferrer">Más información</a>
      </section>

      <section class="results" aria-labelledby="results-title">
        <div class="results-head">
          <h2 id="results-title">Resultados</h2>
          <button id="clear" type="button">Borrar</button>
        </div>
        <p id="empty" class="hint">Aún no hay lecturas.</p>
        <ol id="results" aria-live="polite"></ol>
      </section>
    </main>

    <footer class="foot">
      <p id="versions"></p>
      <p>
        <a href="https://qhago.dev/docs/">Documentación</a> ·
        <a href="https://github.com/qhago-dev/scanner">GitHub</a> ·
        <a href="https://github.com/qhago-dev/scanner/tree/master/showcase">Código de esta demo</a>
      </p>
    </footer>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
